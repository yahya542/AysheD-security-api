name: kalinanas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2269
          script: |
            cd /var/www/AysheD/apiSEC

            # 1. Tarik kode terbaru dari GitHub
            git pull origin main

            # 2. Hentikan dan hapus container lama yang membeku
            docker stop ayshe_api || true
            docker rm ayshe_api || true

            # 3. Jalankan container baru menggunakan base image Python bawaan tanpa perlu Dockerfile
            docker run -d \
              --name ayshe_api \
              -p 8069:8000 \
              -v /var/www/AysheD/apiSEC:/app \
              -w /app \
              python:3.11-slim \
              bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"

