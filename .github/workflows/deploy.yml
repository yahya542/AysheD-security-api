name: kalinanas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2269
          script: |
            cd /var/www/AysheD/apiSEC

            # 1. Tarik kode terbaru dari GitHub
            git pull origin main

            # 2. Buat kembali berkas Dockerfile secara otomatis di server
            cat << 'EOF' > Dockerfile
            FROM python:3.11-slim
            WORKDIR /app
            COPY requirements.txt .
            RUN pip install --no-cache-dir -r requirements.txt
            COPY . .
            EXPOSE 8000
            CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
            EOF

            # 3. Build ulang menggunakan Dockerfile yang baru dibuat
            docker build -t apisec-api .

            # 4. Hentikan dan hapus kontainer lama
            docker stop ayshe_api || true
            docker rm ayshe_api || true

            # 5. Jalankan kontainer baru dengan aman dan berikan hak akses log (jika perlu)
            docker run -d \
              --name ayshe_api \
              -p 8069:8000 \
              --restart unless-stopped \
              apisec-api

