name: kalinanas-deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull & Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2269
          script: |
            set -e

            cd /var/www/AysheD/apiSEC

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Sanitizing database (remove legacy failure_reason values) ==="
            sqlite3 ayshed_auth.db "DELETE FROM login_logs WHERE failure_reason NOT IN ('bad_password', 'unknown_user', 'locked', 'admin_suspended');" 2>/dev/null || true

            echo "=== Building Docker image ==="
            cat << 'DOCKERFILE' > Dockerfile
            FROM python:3.11-slim
            WORKDIR /app
            COPY requirements.txt .
            RUN pip install --no-cache-dir -r requirements.txt

            # Letakkan semua file kode ke dalam package directory apiSEC
            # karena main.py & __init__.py memakai import absolut "from apiSEC.*"
            RUN mkdir -p apiSEC
            COPY . ./apiSEC/

            ENV PYTHONPATH=/app

            EXPOSE 8000
            CMD ["uvicorn", "apiSEC.main:app", "--host", "0.0.0.0", "--port", "8000"]
            DOCKERFILE

            docker build -t apisec-api .

            echo "=== Restarting container ==="
            docker stop ayshe_api || true
            docker rm ayshe_api || true

            # Volume mount database agar persisten antar deploy
            # Host: /var/www/AysheD/apiSEC/ayshed_auth.db
            # Container: /app/apiSEC/ayshed_auth.db
            docker run -d \
              --name ayshe_api \
              -p 8069:8000 \
              --restart unless-stopped \
              -v /var/www/AysheD/apiSEC/ayshed_auth.db:/app/apiSEC/ayshed_auth.db \
              apisec-api

            echo "=== Deployment complete ==="
